<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Iniciar sesión | PC Forge
  </title>
  <link href="css/estilos.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="barra-superior">
   Despacho a todo Chile | Cupón DUOC10 en el carrito
  </div>
  <header class="encabezado">
   <div class="contenedor navegacion">
    <a class="logo" href="index.html">
     <img alt="Logo PC Forge" src="img/logo.svg"/>
     <span>
      PC Forge
     </span>
    </a>
    <nav aria-label="Navegación principal" class="menu">
     <a href="index.html">
      Inicio
     </a>
     <a href="productos.html">
      Productos
     </a>
     <a href="nosotros.html">
      Nosotros
     </a>
     <a href="blog.html">
      Blog
     </a>
     <a href="contacto.html">
      Contacto
     </a>
     <a href="login.html">
      Ingresar
     </a>
     <a href="registro.html">
      Registro
     </a>
     <a class="carrito-link" href="carrito.html">
      🛒 (
      <span class="contador-carrito">
       0
      </span>
      )
     </a>
    </nav>
   </div>
  </header>
  <main class="contenedor">
   <form class="formulario" id="form-login" novalidate="">
    <h1>
     Inicio de sesión
    </h1>
    <div class="campo">
     <label for="correo">
      Correo
     </label>
     <input autocomplete="email" id="correo" maxlength="100" name="correo" placeholder="nombre@gmail.com" required="" type="email"/>
     <small class="error" id="error-correo">
     </small>
    </div>
    <div class="campo">
     <label for="password">
      Contraseña
     </label>
     <input autocomplete="current-password" id="password" maxlength="10" minlength="4" name="password" required="" type="password"/>
     <small class="error" id="error-password">
     </small>
    </div>
    <button class="boton" type="submit">
     Ingresar
    </button>
    <p>
     ¿No tienes cuenta?
     <a href="registro.html">
      Regístrate aquí
     </a>
     .
    </p>
   </form>
  </main>
  <footer class="pie">
   <div class="contenedor pie-contenido">
    <div>
     <strong>
      PC Forge
     </strong>
     <br/>
     Hardware, periféricos y computadores armados.
    </div>
    <div>
     Contacto: contacto@pcforge.cl
     <br/>
     Horario: Lun-Vie 09:00 a 18:00
    </div>
   </div>
  </footer>
  <div class="mensaje" id="mensaje">
  </div>
  <script src="js/datos.js">
  </script>
  <script src="js/validaciones.js">
  </script>
  <script src="js/app.js">
  </script>
 </body>
</html>
